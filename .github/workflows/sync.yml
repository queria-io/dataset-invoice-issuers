name: Sync

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
  schedule:
    # 全件データは毎月 2 稼働日目の 6 時までに出る。毎月 5 日 04:00 JST に取る
    - cron: "0 19 4 * *"
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    uses: queria-io/dataset-shared/.github/workflows/sync.yml@main
    with:
      dataset_name: invoice_issuers
    secrets: inherit
