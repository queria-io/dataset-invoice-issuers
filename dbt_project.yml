name: "invoice_issuers"
version: "1.0.0"

profile: "invoice_issuers"

model-paths: ["models"]
macro-paths: ["shared/macros"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  invoice_issuers:
    +database: invoice_issuers
    +materialized: table
    # raw は取得したまま、stg は型付けと列名の付け替え。どちらも mart の SQL に展開し、テーブルは作らない
    main:
      raw:
        +materialized: ephemeral
      stg:
        +materialized: ephemeral
